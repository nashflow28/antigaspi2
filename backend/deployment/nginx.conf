##############################################
# ANTIGASPI - Configuration Nginx
# À copier dans: /etc/nginx/sites-available/antigaspi
# Puis créer un lien symbolique:
# sudo ln -s /etc/nginx/sites-available/antigaspi /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx
##############################################

server {
    listen 80;
    listen [::]:80;

    server_name api.antigaspi.tg www.api.antigaspi.tg;
    root /var/www/antigaspi/public;

    # Logs
    access_log /var/log/nginx/antigaspi_access.log;
    error_log /var/log/nginx/antigaspi_error.log;

    # Index
    index index.php index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS headers (déjà géré par Laravel, mais peut être ajouté ici)
    # add_header Access-Control-Allow-Origin "*" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle Laravel API routes
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Increase timeout for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Optimize static file serving
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent access to storage files (unless needed)
    location ^~ /storage/ {
        # Allow access to public storage files
        try_files $uri $uri/ =404;
    }

    # Upload size limit (adjust if needed)
    client_max_body_size 20M;
}

