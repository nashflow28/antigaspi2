name: E2E Tests with Maestro

on:
  pull_request:
    branches: [main, develop, feature/*]
  push:
    branches: [main, develop]
  workflow_dispatch: # Manual trigger

jobs:
  e2e-android:
    name: E2E Tests (Android)
    runs-on: macos-latest # macOS for better emulator performance
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Java 17 (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Android app (debug)
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: echo "Emulator started"

      - name: Install app on emulator
        working-directory: mobile
        run: |
          adb install android/app/build/outputs/apk/debug/app-debug.apk

      - name: Run E2E tests
        working-directory: mobile
        run: |
          maestro test e2e/flows/ --format=junit --output=test-results/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-android
          path: mobile/test-results/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-android
          path: ~/.maestro/tests/

  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build iOS app (debug)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace Antigaspi.xcworkspace \
            -scheme Antigaspi \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted mobile/ios/build/Build/Products/Debug-iphonesimulator/Antigaspi.app

      - name: Run E2E tests
        working-directory: mobile
        run: |
          maestro test e2e/flows/ --format=junit --output=test-results/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-ios
          path: mobile/test-results/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-ios
          path: ~/.maestro/tests/

  # Optional: Upload to Maestro Cloud for faster execution
  e2e-maestro-cloud:
    name: E2E Tests (Maestro Cloud)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Upload to Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: mobile/android/app/build/outputs/apk/release/app-release.apk
          flows: mobile/e2e/flows/
          env: |
            ADMIN_EMAIL=admin@antigaspi.com
            ADMIN_PASSWORD=password
