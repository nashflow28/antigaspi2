name: E2E Tests with Maestro

on:
  pull_request:
    branches: [main, develop, feature/*]
  push:
    branches: [main, develop]
  workflow_dispatch: # Manual trigger

# NOTE: Full E2E tests with Maestro require native builds which are done via EAS Build
# This workflow runs unit tests and linting as a CI check
# For full E2E testing, use EAS Build + Maestro Cloud (requires paid plan)

jobs:
  mobile-tests:
    name: Mobile Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run ESLint
        working-directory: mobile
        run: npm run lint || true

      - name: Run Unit Tests
        working-directory: mobile
        run: npm run test:coverage -- --passWithNoTests
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage/

  # E2E Tests via Expo/EAS (requires EXPO_TOKEN secret)
  e2e-expo-preview:
    name: Expo Preview Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Doctor Check
        working-directory: mobile
        run: npx expo-doctor || true

      - name: Check EAS configuration
        working-directory: mobile
        run: |
          if [ -f "eas.json" ]; then
            echo "✅ eas.json found"
            cat eas.json
          else
            echo "⚠️ eas.json not found - EAS Build not configured"
          fi

      # Note: Actual build requires EXPO_TOKEN and EAS subscription
      # Uncomment below for production CI
      # - name: Build Android Preview
      #   working-directory: mobile
      #   run: eas build --platform android --profile preview --non-interactive
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Maestro Cloud E2E (requires API key and pre-built APK)
  e2e-maestro-cloud:
    name: E2E Tests (Maestro Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false # Disabled until Maestro Cloud is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK from EAS
        run: |
          echo "Download APK from EAS Build artifacts"
          # eas build:list --platform android --status finished --limit 1 --json
          # Then download the artifact

      - name: Run Maestro Cloud tests
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: path/to/app.apk
          flows: mobile/e2e/flows/
          env: |
            ADMIN_EMAIL=admin@antigaspi.com
            ADMIN_PASSWORD=password
