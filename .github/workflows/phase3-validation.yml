name: Phase 3 Frontend Validation

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/phase3-validation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/phase3-validation.yml'

jobs:
  validate:
    name: Run Phase 3 validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run phase 3 validation
        working-directory: frontend
        run: npm run validate:phase3

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-validation-artifacts
          path: |
            frontend/phase3-validation-report.json
            frontend/test-results/*.json
          if-no-files-found: error
