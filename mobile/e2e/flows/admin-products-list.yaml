# Admin Products List Flow
# Critical: Verifies products list and filtering
#
# Coverage:
# - Navigate to products screen
# - Products list displays
# - Filter by status (all, active, inactive, pending)
# - Filter by category
# - Search functionality

appId: com.antigaspi.mobile
---
# Login as admin
- launchApp
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Navigate to products management
- tapOn: "Gérer produits"
- waitForAnimationToEnd

# Verify products screen loaded
- assertVisible: "Gestion Produits"
- assertVisible: "Tous"
- assertVisible: "En attente"
- assertVisible: "Actifs"
- assertVisible: "Inactifs"

# Verify search bar present
- assertVisible: "Rechercher un produit..."

# Test "Tous" filter (default)
- assertVisible: "Tous"
- runFlow:
    when:
      visible: "${TEST_PRODUCT_NAME}"
    commands:
      - assertVisible: "${TEST_PRODUCT_NAME}"

# Test "En attente" filter
- tapOn: "En attente"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "produit en attente"
    commands:
      - assertVisible:
          text: "\\d+ produit.*en attente"
          regex: true

# Test "Actifs" filter
- tapOn: "Actifs"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "actif"
    commands:
      - assertVisible: "Actif" # Badge on active products

# Test "Inactifs" filter
- tapOn: "Inactifs"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Inactif"
    commands:
      - assertVisible: "Inactif" # Badge on inactive products

# Reset to "Tous"
- tapOn: "Tous"
- waitForAnimationToEnd

# Test category filter
- scroll
- tapOn: "Toutes catégories"
- waitForAnimationToEnd

# Select specific category
- tapOn: "${TEST_CATEGORY_NAME}"
- waitForAnimationToEnd
- assertVisible: "${TEST_CATEGORY_NAME}" # Category chip selected

# Test search
- tapOn: "Rechercher un produit..."
- inputText: "Pain"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Pain"
    commands:
      - assertVisible: "Pain"

# Clear search
- tapOn:
    id: "clear-search-button"
- waitForAnimationToEnd

# Test refresh
- tapOn:
    id: "refresh-products-button"
- waitForAnimationToEnd
- assertVisible: "Gestion Produits"

# Success
- stopApp
