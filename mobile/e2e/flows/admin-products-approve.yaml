# Admin Approve Product Flow
# Critical: Verifies admin can approve pending products
#
# Coverage:
# - Navigate to pending products
# - Open product detail
# - Approve product with confirmation
# - Verify success message
# - Product removed from pending list

appId: com.antigaspi.mobile
---
# Login as admin
- launchApp
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Navigate to products
- tapOn: "Gérer produits"
- waitForAnimationToEnd

# Filter by pending
- tapOn: "En attente"
- waitForAnimationToEnd

# Verify pending products exist
- runFlow:
    when:
      visible: "produit en attente"
    commands:
      # Find first pending product
      - tapOn:
          text: ".*"
          regex: true
          index: 0 # First product card
      - waitForAnimationToEnd

      # Verify detail modal opened
      - assertVisible: "Détails Produit"

      # Verify approve button exists
      - assertVisible: "Approuver le produit"

      # Tap approve
      - tapOn: "Approuver le produit"
      - waitForAnimationToEnd

      # Confirm approval in alert
      - runFlow:
          when:
            visible: "Approuver"
          commands:
            - tapOn: "Approuver"

      # Wait for API call
      - waitForAnimationToEnd

      # Verify success message
      - assertVisible:
          text: "Succès|approuvé"
          regex: true

      # Verify modal closed or product updated
      - runFlow:
          when:
            visible: "Détails Produit"
          commands:
            # Close modal if still open
            - tapOn:
                text: "✕|Fermer"
                regex: true

      # Back to list
      - waitForAnimationToEnd

      # Verify we're back on products screen
      - assertVisible: "Gestion Produits"

# Success
- stopApp
