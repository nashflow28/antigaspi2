# Smoke Test - Admin Login
# Critical: Verifies admin can login and access dashboard
#
# Coverage:
# - Login screen renders
# - Admin credentials work
# - Dashboard displays after login
# - Stats are visible

appId: com.antigaspi.mobile
---
# Launch app
- launchApp

# Verify landing screen
- assertVisible: "Connexion"
- assertVisible: "Email"
- assertVisible: "Mot de passe"

# Login as admin
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"

# Wait for dashboard to load
- waitForAnimationToEnd

# Verify dashboard appears
- assertVisible: "Dashboard"
- assertVisible: "Administrateur"

# Verify key stats are present
- assertVisible: "Utilisateurs"
- assertVisible: "Commerçants"
- assertVisible: "Produits"
- assertVisible: "Réservations"
- assertVisible: "Revenus totaux"
- assertVisible: "XOF"

# Verify quick actions
- assertVisible: "Actions rapides"
- assertVisible: "Gérer utilisateurs"
- assertVisible: "Gérer produits"
- assertVisible: "Gérer commerçants"
- assertVisible: "Gérer catégories"

# Success
- stopApp
