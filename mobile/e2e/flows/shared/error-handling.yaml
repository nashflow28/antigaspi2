# Error Handling Flow
# Critical: Verifies app handles errors gracefully
#
# Coverage:
# - Invalid login credentials
# - Network error recovery
# - Validation errors (rejection reason too short)
# - Empty states display correctly

appId: com.antigaspi.mobile
---
# Test 1: Invalid Login Credentials
- launchApp
- assertVisible: "Connexion"

# Try invalid credentials
- tapOn: "Email"
- inputText: "invalid@email.com"
- tapOn: "Mot de passe"
- inputText: "wrongpassword"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Verify error message appears
- runFlow:
    when:
      visible:
        text: "Erreur|incorrect|invalide"
        regex: true
    commands:
      - assertVisible:
          text: "Erreur|incorrect|invalide"
          regex: true

# Clear and login correctly
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Test 2: Validation Error - Rejection Reason Too Short
- tapOn: "Gérer produits"
- waitForAnimationToEnd

# Filter pending
- tapOn: "En attente"
- waitForAnimationToEnd

# Try to reject with short reason
- runFlow:
    when:
      visible: "produit en attente"
    commands:
      - tapOn:
          text: ".*"
          regex: true
          index: 0
      - waitForAnimationToEnd
      - tapOn: "Rejeter le produit"
      - waitForAnimationToEnd

      # Enter reason too short (< 10 chars)
      - runFlow:
          when:
            visible: "raison"
          commands:
            - inputText: "Court" # Only 5 chars
            - tapOn: "Rejeter"
            - waitForAnimationToEnd

            # Verify error about min length
            - runFlow:
                when:
                  visible:
                    text: "10 caractères|trop court"
                    regex: true
                commands:
                  - assertVisible:
                      text: "10 caractères|trop court"
                      regex: true

            # Close error
            - runFlow:
                when:
                  visible: "OK"
                commands:
                  - tapOn: "OK"

      # Close modal
      - runFlow:
          when:
            visible:
              text: "✕|Annuler"
              regex: true
          commands:
            - tapOn:
                text: "✕|Annuler"
                regex: true

# Test 3: Empty State
- tapOn: "Tous" # Reset filter
- waitForAnimationToEnd

# Search for non-existent product
- tapOn: "Rechercher un produit..."
- inputText: "ProduitInexistantXYZ123"
- waitForAnimationToEnd

# Verify empty state displays
- runFlow:
    when:
      visible:
        text: "Aucun.*trouvé"
        regex: true
    commands:
      - assertVisible:
          text: "Aucun.*trouvé"
          regex: true
      - assertVisible:
          text: "modifier.*filtres|Essayez"
          regex: true

# Clear search
- runFlow:
    when:
      visible:
        id: "clear-search-button"
    commands:
      - tapOn:
          id: "clear-search-button"

# Test 4: Network Recovery (simulated by refresh)
- tapOn:
    id: "refresh-products-button"
- waitForAnimationToEnd

# Verify data reloads successfully
- assertVisible: "Gestion Produits"
- assertVisible: "Tous"

# Success - all error scenarios handled
- stopApp
