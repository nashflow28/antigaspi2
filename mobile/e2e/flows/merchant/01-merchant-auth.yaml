name: Merchant Authentication Flow
tags:
  - authentication
  - merchant
  - critical

---
# Test 1: Login with valid merchant credentials
- launchApp
- assertVisible: "Antigaspi"

# Wait for login screen to load
- waitForAnimationToEnd

# Check login form is visible
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible:
    text: "Se connecter"
    enabled: true

# Fill login form with merchant credentials
- tapOn: "Email"
- inputText: ${MERCHANT_EMAIL}

- tapOn: "Password"
- inputText: ${MERCHANT_PASSWORD}

# Submit login
- tapOn: "Se connecter"

# Wait for navigation
- waitForAnimationToEnd:
    timeout: 10000

# Verify successful login - should see merchant name or dashboard
- assertVisible:
    text: "${MERCHANT_NAME}|Tableau de bord|Dashboard|Mes produits"
    timeout: 10000

---
# Test 2: Verify merchant dashboard access
- assertVisible:
    text: "Mes produits|My products|Produits"

# Should see merchant-specific features
- assertVisible:
    text: "Ajouter|Add|Nouveau produit"
    optional: true

---
# Test 3: Logout
- tapOn:
    text: "Profil|Profile"

- waitForAnimationToEnd

# Should see merchant profile info
- assertVisible: ${MERCHANT_NAME}
- assertVisible: ${MERCHANT_EMAIL}
- assertVisible:
    text: "Commerçant|Merchant"

# Tap logout button
- tapOn:
    text: "Déconnexion|Logout"

# Confirm logout if modal appears
- tapOn:
    text: "Confirmer|OK"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Should be back on login screen
- assertVisible: "Se connecter"
- assertVisible: "Email"
- assertVisible: "Password"

---
# Test 4: Login with invalid credentials
- tapOn: "Email"
- inputText: "invalid@merchant.com"

- tapOn: "Password"
- inputText: "wrongpassword"

- tapOn: "Se connecter"

- waitForAnimationToEnd:
    timeout: 5000

# Should see error message
- assertVisible:
    text: "Identifiants invalides|Invalid credentials|Erreur"
    timeout: 5000

# Should still be on login screen
- assertVisible: "Se connecter"
