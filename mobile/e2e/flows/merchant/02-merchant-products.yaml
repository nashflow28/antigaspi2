name: Merchant Product Management Flow
tags:
  - products
  - merchant
  - critical

---
# Prerequisites: Login as merchant first
- runFlow: 01-merchant-auth.yaml

---
# Test 1: View merchant products list
- tapOn:
    text: "Mes produits|My products|Produits"

- waitForAnimationToEnd

# Should see products list or empty state
- assertVisible:
    text: "Pain|Croissant|Aucun produit|No products|Ajouter"

---
# Test 2: Add new product
- tapOn:
    text: "Ajouter|Add|Nouveau produit|New product"
    enabled: true

- waitForAnimationToEnd

# Should see product form
- assertVisible: "Nom du produit|Product name"
- assertVisible: "Prix original|Original price"
- assertVisible: "Prix réduit|Discounted price"
- assertVisible: "Quantité|Quantity"
- assertVisible: "Catégorie|Category"

# Fill product form
- tapOn: "Nom du produit|Product name"
- inputText: "Test Product Maestro"

- tapOn: "Prix original|Original price"
- inputText: "1000"

- tapOn: "Prix réduit|Discounted price"
- inputText: "500"

- tapOn: "Quantité|Quantity"
- inputText: "10"

# Select category
- tapOn: "Catégorie|Category"
- waitForAnimationToEnd
- tapOn: ${TEST_CATEGORY_BAKERY}
- waitForAnimationToEnd

# Submit form
- tapOn:
    text: "Enregistrer|Save|Créer"

- waitForAnimationToEnd:
    timeout: 10000

# Should see success notification
- assertVisible:
    text: "Produit créé|Product created|Succès|Success"
    timeout: 10000

# Should be back on products list
- assertVisible: "Test Product Maestro"
- assertVisible: "500 XOF"

---
# Test 3: Edit existing product
- tapOn: "Test Product Maestro"

- waitForAnimationToEnd

# Should see product details
- assertVisible: "Test Product Maestro"
- assertVisible: "1000 XOF"  # Original price
- assertVisible: "500 XOF"   # Discounted price

# Tap edit button
- tapOn:
    text: "Modifier|Edit"
    enabled: true

- waitForAnimationToEnd

# Change quantity
- tapOn: "Quantité|Quantity"
- eraseText
- inputText: "20"

# Save changes
- tapOn:
    text: "Enregistrer|Save"

- waitForAnimationToEnd:
    timeout: 10000

# Should see success notification
- assertVisible:
    text: "Produit mis à jour|Product updated|Succès"
    timeout: 10000

---
# Test 4: Toggle product availability
- tapOn:
    point: "5%,10%"  # Back button
    optional: true

- waitForAnimationToEnd

- tapOn: "Test Product Maestro"

- waitForAnimationToEnd

# Find and toggle active switch
- tapOn:
    text: "Actif|Active|Disponible|Available"

- waitForAnimationToEnd

# Should see status change confirmation
- assertVisible:
    text: "Statut mis à jour|Status updated"
    timeout: 5000
    optional: true

---
# Test 5: View product statistics
- scroll

# Should see stats like views, reservations
- assertVisible:
    text: "Vues|Views|Réservations|Reservations"
    optional: true

---
# Test 6: Delete product
- tapOn:
    text: "Supprimer|Delete"
    enabled: true
    optional: true

- waitForAnimationToEnd

# Confirm deletion
- tapOn:
    text: "Confirmer|Oui|Yes"

- waitForAnimationToEnd:
    timeout: 5000

# Should see success notification
- assertVisible:
    text: "Produit supprimé|Product deleted|Succès"
    timeout: 10000
    optional: true

# Product should no longer be visible
- assertNotVisible:
    text: "Test Product Maestro"
    timeout: 5000
    optional: true
