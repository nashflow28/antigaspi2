name: Profile and Settings Flow
tags:
  - profile
  - settings
  - consumer

---
# Prerequisites: Login first
- runFlow: 01-consumer-auth.yaml

---
# Test: View profile information
- tapOn: "Profil|Profile"

- waitForAnimationToEnd

# Should display user info
- assertVisible: ${CONSUMER_NAME}
- assertVisible: ${CONSUMER_EMAIL}
- assertVisible: "Consommateur|Consumer"

---
# Test: Edit profile
- assertVisible:
    text: "Modifier|Edit"
    enabled: true

- tapOn: "Modifier|Edit"

- waitForAnimationToEnd

# Should see edit form
- assertVisible: "Nom|Name"
- assertVisible: "Email"

# Change name
- tapOn: "Nom|Name"
- eraseText
- inputText: "Jean UPDATED"

# Save
- tapOn: "Enregistrer|Save"

- waitForAnimationToEnd:
    timeout: 5000

# Should see success notification
- assertVisible:
    text: "Profil mis à jour|Profile updated|Succès"
    timeout: 5000

# Verify name changed
- assertVisible: "Jean UPDATED"

---
# Test: Toggle dark mode
- tapOn: "Mode sombre|Dark mode"

- waitForAnimationToEnd

# UI should change to dark theme
# (Visual check - Maestro can't easily verify colors)
- assertVisible: "Mode sombre|Dark mode"

# Toggle back to light mode
- tapOn: "Mode sombre|Dark mode"

- waitForAnimationToEnd

---
# Test: Toggle notifications
- scroll

- tapOn: "Notifications"

- waitForAnimationToEnd

# Should show confirmation
- assertVisible: "Notifications"

---
# Test: View reservations history
- scroll

- tapOn: "Historique|History"

- waitForAnimationToEnd

# Should navigate to reservations page
- assertVisible: "Réservations|Reservations"
- assertVisible: "En attente|Annulées"  # Tabs
