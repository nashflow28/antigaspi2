# Admin Suspend User Flow
# Medium Priority: Verifies admin can suspend/unsuspend users
#
# Coverage:
# - Navigate to users management
# - Find active user
# - Suspend user with confirmation
# - Verify success
# - Unsuspend user
# - Verify user active again

appId: com.antigaspi.mobile
---
# Login as admin
- launchApp
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Navigate to users management
- tapOn: "Gérer utilisateurs"
- waitForAnimationToEnd

# Verify users screen
- assertVisible: "Gestion Utilisateurs"
- assertVisible: "Tous"
- assertVisible: "Actifs"
- assertVisible: "Suspendus"

# Filter by active users
- tapOn: "Actifs"
- waitForAnimationToEnd

# Find and tap on first active user
- runFlow:
    when:
      visible: "Actif"
    commands:
      # Tap on first user card
      - tapOn:
          text: ".*@.*"
          regex: true
          index: 0
      - waitForAnimationToEnd

      # Verify detail modal
      - assertVisible: "Détails Utilisateur"

      # Find and tap suspend button
      - runFlow:
          when:
            visible: "Suspendre"
          commands:
            - tapOn: "Suspendre"
            - waitForAnimationToEnd

            # Confirm suspension
            - runFlow:
                when:
                  visible: "Suspendre"
                commands:
                  - tapOn: "Suspendre"

            # Verify success
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible: "Succès|suspendu"
                  regex: true
                commands:
                  - assertVisible:
                      text: "Succès|suspendu"
                      regex: true

      # Close modal
      - runFlow:
          when:
            visible: "✕"
          commands:
            - tapOn: "✕"

# Test unsuspend - switch to suspended users
- tapOn: "Suspendus"
- waitForAnimationToEnd

# Find suspended user
- runFlow:
    when:
      visible: "Suspendu"
    commands:
      - tapOn:
          text: ".*@.*"
          regex: true
          index: 0
      - waitForAnimationToEnd

      # Tap unsuspend
      - runFlow:
          when:
            visible: "Réactiver"
          commands:
            - tapOn: "Réactiver"
            - waitForAnimationToEnd
            - tapOn: "Réactiver" # Confirm

            # Verify success
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible: "Succès|réactivé"
                  regex: true
                commands:
                  - assertVisible:
                      text: "Succès|réactivé"
                      regex: true

# Success
- stopApp
