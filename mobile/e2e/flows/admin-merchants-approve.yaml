# Admin Approve Merchant Flow
# Medium Priority: Verifies admin can approve pending merchants
#
# Coverage:
# - Navigate to merchants management
# - Filter by pending
# - Approve merchant
# - Verify success

appId: com.antigaspi.mobile
---
# Login as admin
- launchApp
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Navigate to merchants management
- tapOn: "Gérer commerçants"
- waitForAnimationToEnd

# Verify merchants screen
- assertVisible: "Gestion Commerçants"
- assertVisible: "Tous"
- assertVisible: "En attente"
- assertVisible: "Vérifiés"

# Filter by pending
- tapOn: "En attente"
- waitForAnimationToEnd

# Check if pending merchants exist
- runFlow:
    when:
      visible: "commerçant.*en attente"
      regex: true
    commands:
      # Find first pending merchant
      - tapOn:
          text: ".*"
          regex: true
          index: 0 # First merchant card
      - waitForAnimationToEnd

      # Verify we can see merchant details
      - assertVisible:
          text: ".*@.*\\.com"
          regex: true # Email present

      # Find approve button
      - runFlow:
          when:
            visible: "Approuver"
          commands:
            - tapOn: "Approuver"
            - waitForAnimationToEnd

            # Confirm approval
            - runFlow:
                when:
                  visible: "Approuver"
                commands:
                  - tapOn: "Approuver"

            # Verify success
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible: "Succès|approuvé"
                  regex: true
                commands:
                  - assertVisible:
                      text: "Succès|approuvé"
                      regex: true

# Back to list
- waitForAnimationToEnd
- assertVisible: "Gestion Commerçants"

# Success
- stopApp
