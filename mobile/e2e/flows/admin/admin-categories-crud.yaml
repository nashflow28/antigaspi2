# Admin Categories CRUD Flow
# Low Priority: Verifies admin can create, edit, delete categories
#
# Coverage:
# - Navigate to categories
# - Create new category
# - Edit category
# - Delete category (if safe)

appId: com.antigaspi.mobile
---
# Login as admin
- launchApp
- tapOn: "Email"
- inputText: "${ADMIN_EMAIL}"
- tapOn: "Mot de passe"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "Se connecter"
- waitForAnimationToEnd

# Navigate to categories management
- tapOn: "Gérer catégories"
- waitForAnimationToEnd

# Verify categories screen
- assertVisible: "Catégories de produits"
- assertVisible:
    text: "\\d+ catégorie"
    regex: true

# Test CREATE: Open create modal
- tapOn:
    id: "create-category-button"
- waitForAnimationToEnd

# Verify create modal opened
- assertVisible: "Nouvelle catégorie"

# Fill in category name (min 3 chars)
- tapOn: "Nom de la catégorie"
- inputText: "Test E2E Category"

# Optional: Fill description
- runFlow:
    when:
      visible: "Description"
    commands:
      - tapOn: "Description"
      - inputText: "Catégorie de test créée par Maestro E2E"

# Save category
- tapOn: "Créer"
- waitForAnimationToEnd

# Verify success or back to list
- runFlow:
    when:
      visible: "Succès|créée"
      regex: true
    commands:
      - assertVisible:
          text: "Succès|créée"
          regex: true
      - waitForAnimationToEnd

# Verify new category appears in list
- assertVisible: "Test E2E Category"

# Test EDIT: Find and edit the category
- tapOn: "Test E2E Category"
- waitForAnimationToEnd

# Tap edit button
- runFlow:
    when:
      visible:
        id: "edit-category-button"
    commands:
      - tapOn:
          id: "edit-category-button"
      - waitForAnimationToEnd

      # Verify edit modal
      - assertVisible: "Modifier la catégorie"

      # Update name
      - tapOn: "Nom de la catégorie"
      - inputText: " Updated"

      # Save
      - tapOn: "Modifier"
      - waitForAnimationToEnd

      # Verify success
      - runFlow:
          when:
            visible: "Succès|modifiée"
            regex: true
          commands:
            - assertVisible:
                text: "Succès|modifiée"
                regex: true

# Test DELETE: Delete the test category
- tapOn: "Test E2E Category Updated"
- waitForAnimationToEnd

# Tap delete button
- runFlow:
    when:
      visible:
        id: "delete-category-button"
    commands:
      - tapOn:
          id: "delete-category-button"
      - waitForAnimationToEnd

      # Confirm deletion
      - runFlow:
          when:
            visible: "Supprimer"
          commands:
            - tapOn: "Supprimer"

      # Verify success
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Succès|supprimée"
            regex: true
          commands:
            - assertVisible:
                text: "Succès|supprimée"
                regex: true

# Verify category removed from list
- runFlow:
    when:
      notVisible: "Test E2E Category Updated"
    commands:
      - assertNotVisible: "Test E2E Category Updated"

# Success
- stopApp
