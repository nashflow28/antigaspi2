appId: host.exp.exponent
name: Products Browsing Flow
tags:
  - products
  - consumer
  - critical

---
# Prerequisites: Login first
- runFlow: 01-consumer-auth.yaml

---
# Test: Browse products list
- tapOn:
    text: "Produits|Products"

- waitForAnimationToEnd

# Should see products list
- assertVisible: "Pain|Croissant|Banane"  # Product names

# Check product card has required info
- assertVisible: "XOF|FCFA"  # Price in XOF
- assertVisible: "%"  # Discount percentage

---
# Test: View product details
- tapOn: "Pain complet artisanal"

- waitForAnimationToEnd

# Should see product detail page
- assertVisible: "Pain complet artisanal"
- assertVisible: "500 XOF"  # Original price
- assertVisible: "250 XOF"  # Discounted price
- assertVisible: "-50%"  # Discount badge

# Should see merchant info
- assertVisible: "Boulangerie|Marie Martin"

# Should see quantity selector
- assertVisible: "Quantité|Quantity"

# Should see reserve button
- assertVisible:
    text: "Réserver|Reserve"
    enabled: true

---
# Test: Navigate back to products list
- tapOn:
    point: "5%,10%"  # Back button top-left

- waitForAnimationToEnd

# Should be back on products list
- assertVisible: "Pain|Croissant|Banane"

---
# Test: Search products
- tapOn:
    id: "search-input"
    optional: true

- inputText: "pain"

- waitForAnimationToEnd

# Should show only bread products
- assertVisible: "Pain"

---
# Test: Scroll to load more products
- scroll

- waitForAnimationToEnd

# Should show more products or empty state
- assertVisible: "XOF|Aucun produit|No products"
