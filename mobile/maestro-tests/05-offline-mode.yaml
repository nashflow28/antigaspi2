appId: host.exp.exponent
name: Offline Mode and Sync Flow
tags:
  - offline
  - sync
  - advanced

---
# Prerequisites: Login first
- runFlow: 01-consumer-auth.yaml

---
# Test: Create reservation while offline
# Note: Maestro doesn't have native airplane mode toggle
# This test assumes manual setup or emulator command

# Go to products
- tapOn: "Produits|Products"

- waitForAnimationToEnd

# Create a reservation
- tapOn: "Pain complet artisanal"

- waitForAnimationToEnd

- tapOn: "Réserver|Reserve"

- waitForAnimationToEnd:
    timeout: 10000

# In offline mode, should show:
# - Success notification with "Sera synchronisée|Will sync" message
# OR
# - Offline indicator banner

- assertVisible:
    text: "Réservation créée|Hors ligne|Offline|Sera synchronisée"
    timeout: 5000

---
# Test: Verify reservation has pending sync flag
- tapOn:
    point: "5%,10%"  # Back

- tapOn: "Réservations|Reservations"

- waitForAnimationToEnd

# Should see reservation with sync pending indicator
- assertVisible: "Pain complet artisanal"
- assertVisible:
    text: "En attente de synchronisation|Pending sync|⏳"
    optional: true

---
# Test: Connectivity banner
# Should see offline banner at top or bottom
- assertVisible:
    text: "Hors ligne|Offline|Pas de connexion|No connection"
    optional: true

---
# Test: Re-enable network and sync
# (Requires manual network toggle or emulator command)
# After network is restored:

- waitForAnimationToEnd:
    timeout: 5000

# Should see sync success notification
- assertVisible:
    text: "Synchronisé|Synced|En ligne|Online"
    timeout: 15000
    optional: true

# Refresh reservations list
- pullToRefresh

- waitForAnimationToEnd

# Sync indicator should disappear
- assertNotVisible:
    text: "En attente de synchronisation|Pending sync"
    timeout: 5000
    optional: true
